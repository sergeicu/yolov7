# Focal loss hyperparameters for 4-class fracture detection pipeline
# Based on hyp.scratch.p6_andylabels294_v4_1.yaml
# fl_gamma = 1.0

lr0: 0.001
lrf: 0.2
momentum: 0.937
warmup_epochs: 1.0
weight_decay: 0.0005
warmup_momentum: 0.8
warmup_bias_lr: 0.1
box: 0.05
cls: 0.1
cls_pw: 1.0
obj: 0.8
obj_pw: 1.0
iou_t: 0.20
anchor_t: 4.0
fl_gamma: 1.0

hsv_h: 0.0
hsv_s: 0.0
hsv_v: 0.0
degrees: 10.0
translate: 0.1
scale: 0.5
shear: 0.5
fliplr: 0.5
mosaic: 0.0
mixup: 0.0
perspective: 0.0
flipud: 0.0

copy_paste: 0.0
paste_in: 0.0
loss_ota: 0

freeze_mode: 'none'
freeze_layers_count: 0
freeze_layers_specific: []
