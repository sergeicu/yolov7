# Hyperparameters for balanced sampling experiments (no focal loss)
# Based on hyp.scratch.p6_pipeline_focal_g1.0.yaml
# Same loss weights (cls=0.1, obj=0.8) as focal experiments
# fl_gamma = 0.0 (focal loss disabled)
# This isolates the effect of balanced sampling from loss weight changes

lr0: 0.001
lrf: 0.2
momentum: 0.937
warmup_epochs: 1.0
weight_decay: 0.0005
warmup_momentum: 0.8
warmup_bias_lr: 0.1
box: 0.05
cls: 0.1
cls_pw: 1.0
obj: 0.8
obj_pw: 1.0
iou_t: 0.20
anchor_t: 4.0
fl_gamma: 0.0

hsv_h: 0.0
hsv_s: 0.0
hsv_v: 0.0
degrees: 10.0
translate: 0.1
scale: 0.5
shear: 0.5
fliplr: 0.5
mosaic: 0.0
mixup: 0.0
perspective: 0.0
flipud: 0.0

copy_paste: 0.0
paste_in: 0.0
loss_ota: 0

freeze_mode: 'none'
freeze_layers_count: 0
freeze_layers_specific: []
