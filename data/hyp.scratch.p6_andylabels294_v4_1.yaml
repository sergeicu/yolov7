# copy of v2_2 -> changing loss parameters
  # increased weight decay to original 0.0005
  # weight_decay: Keep at 0.0005 as overfitting is less of a concern when we're not trying to distinguish between classes


# save as v2, except that we turned off mosaic and mixup, and hsv_h, hsv_s, hsv_v augmentations 

# instructions - https://claude.ai/chat/0580f411-be6a-45f7-8969-d74301c2b985
lr0: 0.001  # Reduced from 0.01  # initial learning rate (SGD=1E-2, Adam=1E-3)
lrf: 0.2  # final OneCycleLR learning rate (lr0 * lrf)
momentum: 0.937  # SGD momentum/Adam beta1
# weight_decay: 0.0005  # optimizer weight decay 5e-4
# warmup_epochs: 3.0  # warmup epochs (fractions ok)

# Adjust training dynamics
warmup_epochs: 1.0  # Reduced warmup
weight_decay: 0.0005  # Reduced to prevent overfitting


warmup_momentum: 0.8  # warmup initial momentum
warmup_bias_lr: 0.1  # warmup initial bias lr
box: 0.05  # box loss gain
cls: 0.3  # cls loss gain
cls_pw: 1.0  # cls BCELoss positive_weight
obj: 0.7  # obj loss gain (scale with pixels)
obj_pw: 1.0  # obj BCELoss positive_weight
iou_t: 0.20  # IoU training threshold
anchor_t: 4.0  # anchor-multiple threshold
# anchors: 3  # anchors per output layer (0 to ignore)
fl_gamma: 0.0  # focal loss gamma (efficientDet default gamma=1.5)



# hsv_h: 0.0  # image HSV-Hue augmentation (fraction)
# hsv_s: 0.0  # image HSV-Saturation augmentation (fraction)
# hsv_v: 0.0  # image HSV-Value augmentation (fraction)
# degrees: 0.0  # image rotation (+/- deg)
# translate: 0.0  # image translation (+/- fraction)
# scale: 0.0  # image scale (+/- gain)
# shear: 0.0  # image shear (+/- deg)
# perspective: 0.0  # image perspective (+/- fraction), range 0-0.001
# flipud: 0.0  # image flip up-down (probability)
# fliplr: 0.0  # image flip left-right (probability)
# mosaic: 0.0  # image mosaic (probability)
# mixup: 0.0  # image mixup (probability)


# Enable augmentations
hsv_h: 0.0 # probably switch off? 
hsv_s: 0.0
hsv_v: 0.0 
degrees: 10.0
translate: 0.1
scale: 0.5
shear: 0.5
fliplr: 0.5
mosaic: 0.0 # maybe ignore? 
mixup: 0.0 # maybe ignore? 
perspective: 0.0  # image perspective (+/- fraction), range 0-0.001        
flipud: 0.0  # image flip up-down (probability)


copy_paste: 0.0  # image copy paste (probability)
paste_in: 0.0  # image copy paste (probability), use 0 for faster training
loss_ota: 0 # use ComputeLossOTA, use 0 for faster training

# Freezing options (choose one):
freeze_mode: 'none'  # Options: 'none', 'count', 'specific', 'backbone'
freeze_layers_count: 0  # Used when freeze_mode='count': number of initial layers to freeze
freeze_layers_specific: []  # Used when freeze_mode='specific': list of layer indices to freeze


# To freeze first 10 layers:
  # freeze_mode: 'count'
  # freeze_layers_count: 10

# To freeze specific layers:
  # freeze_mode: 'specific'
  # freeze_layers_specific: [0, 1, 2, 3, 4]

# To freeze entire backbone:
  # freeze_mode: 'backbone'

